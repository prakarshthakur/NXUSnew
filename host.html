<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="nxus-ga-measurement-id" content="G-30KZZMNYKN">
    <script src="analytics.js" defer></script>
    <title>NXUS | Host a Party</title>
    <link rel="icon" type="image/png" href="assets/nxus_logo.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        body { background: #000000; overflow-x: hidden; }

        .river-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 80%, rgba(255, 0, 0, 0.5) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 75% 20%, rgba(255, 0, 0, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse 90% 60% at 50% 50%, rgba(255, 0, 0, 0.8) 0%, transparent 80%),
                radial-gradient(ellipse 40% 80% at 10% 30%, rgba(255, 0, 0, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse 50% 70% at 90% 70%, rgba(255, 0, 0, 0.25) 0%, transparent 55%),
                linear-gradient(160deg, #000000 0%, #000000 30%, #000000 60%, #000000 100%);
        }
        .river-bg::before, .river-bg::after { display: none; }
        .old-river-bg-before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 120% 15% at 30% 85%, rgba(255, 0, 0, 0.35) 0%, transparent 70%),
                radial-gradient(ellipse 100% 12% at 70% 15%, rgba(255, 0, 0, 0.2) 0%, transparent 60%);
            filter: blur(30px);
        }
        .river-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(0, 0, 0, 0.7) 100%);
        }

        /* Nav */
        .feed-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
            z-index: 20;
            pointer-events: none;
        }
        .feed-nav * { pointer-events: auto; }

        .nav-logo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.6rem;
            color: #ff0000;
            letter-spacing: 0.1em;
            cursor: pointer;
        }

        .nav-btn {
            background: rgba(255, 45, 45, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 45, 45, 0.2);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.8);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
        }
        .nav-btn:hover { background: rgba(255, 45, 45, 0.15); color: #fff; }

        /* Page */
        .host-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 1.2rem;
        }

        .host-header { text-align: center; margin-bottom: 0.3rem; }
        .host-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(2rem, 6vw, 2.8rem);
            color: #ff0000;
            letter-spacing: 0.1em;
        }
        .host-subtitle {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            color: rgba(255,0,0,0.3);
            letter-spacing: 0.05em;
            margin-top: 0.3rem;
        }

        /* Glass form panel */
        .glass-form {
            position: relative;
            background: rgba(255, 0, 0, 0.05);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 0, 0, 0.12);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            overflow: hidden;
        }
        .glass-form::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,0,0.3), transparent);
            pointer-events: none;
        }
        .glass-form::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            background: linear-gradient(to bottom, rgba(255,0,0,0.06) 0%, transparent 12%);
            pointer-events: none;
        }
        .glass-form > * { position: relative; z-index: 1; }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-row {
            display: flex;
            gap: 0.8rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
        }

        .form-label {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.02em;
        }

        .glass-input {
            background: rgba(255, 45, 45, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 45, 45, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 0 0 0.5px rgba(255,45,45,0.05) inset;
        }
        .glass-input:focus {
            border-color: rgba(255, 45, 45, 0.5);
            background: rgba(255, 45, 45, 0.09);
            box-shadow: 0 0 20px rgba(255, 45, 45, 0.1);
        }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.25); }

        .glass-textarea {
            resize: none;
            min-height: 90px;
            line-height: 1.5;
        }

        .glass-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='rgba(255,0,0,0.4)' stroke-width='1.5'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            padding-right: 2.5rem;
        }

        .submit-btn {
            background: rgba(255, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 0, 0.15);
            border-radius: 14px;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,0,0.3), transparent);
        }
        .submit-btn:hover {
            background: rgba(255, 0, 0, 0.16);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .submit-btn:active { transform: translateY(1px); }

        /* Hosted parties list */
        .section-divider {
            display: flex;
            align-items: center;
            width: 100%;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            font-family: var(--font-mono);
        }
        .section-divider::before, .section-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,0,0,0.08);
        }
        .section-divider span { padding: 0 12px; }

        .hosted-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        .hosted-card {
            position: relative;
            background: rgba(255, 0, 0, 0.04);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 0, 0, 0.1);
            border-radius: 18px;
            padding: 1.3rem 1.4rem;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .hosted-card::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,0,0.2), transparent);
            pointer-events: none;
        }
        .hosted-card:hover { border-color: rgba(255,0,0,0.18); }

        .hosted-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.4rem;
        }
        .hosted-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 700;
            color: #ff2d2d;
        }

        .hosted-live {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
            letter-spacing: 0.05em;
            flex-shrink: 0;
            margin-left: 0.8rem;
        }

        .hosted-time {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.02em;
            margin-bottom: 0.3rem;
        }

        .hosted-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .hosted-desc {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 0.5rem;
            line-height: 1.5;
        }

        .hosted-stats {
            display: flex;
            gap: 1.2rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,45,45,0.08);
        }

        .stat {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.45);
        }
        .stat strong {
            color: #ff2d2d;
            font-family: var(--font-heading);
            font-size: 1rem;
            display: block;
            margin-bottom: 0.15rem;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid rgba(255, 45, 45, 0.2);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            padding: 0.35rem 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
        }
        .delete-btn:hover {
            background: rgba(255, 45, 45, 0.1);
            color: #ff2d2d;
            border-color: rgba(255, 45, 45, 0.4);
        }

        /* Empty state */
        .empty-hosted {
            text-align: center;
            padding: 2rem;
            font-family: var(--font-mono);
        }
        .empty-hosted p:first-child { font-size: 2rem; margin-bottom: 0.5rem; }
        .empty-hosted h3 {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            color: #ff2d2d;
            margin-bottom: 0.4rem;
        }
        .empty-hosted p:last-child {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 45, 45, 0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 45, 45, 0.25);
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #ffffff;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .feed-nav { padding: 1rem; }
            .host-page { max-width: 94%; }
            .glass-form { padding: 1.5rem; border-radius: 20px; }
            .form-row { flex-direction: column; gap: 1rem; }
            .hosted-card { padding: 1.1rem 1.2rem; }
        }
    </style>
    <style>
        body { background: #000000 !important; }
        .river-bg, .river-bg::before, .river-bg::after, .old-river-bg-before { display: none !important; }
        .party-card, .detail-card, .glass-form, .liquid-glass, .hosted-card, .modal-glass, .empty-state, .glass-panel, .login-panel {
            background: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(40px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
            border: 1px solid rgba(255, 0, 0, 0.3) !important;
        }
        .request-item {
            display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255,45,45,0.1);
        }
    </style>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAf9mNqgec3VKLVoa9xs9GBcTIXdiCrpD8&libraries=places" async defer></script>
</head>
<body>
    <div class="river-bg"></div>

    <div class="feed-nav">
        <img src="assets/nxus_logo.png" alt="NXUS" style="height:24px;width:auto;mix-blend-mode:screen;cursor:pointer;" onclick="window.location.href='feed.html'">
        <button class="nav-btn" onclick="window.location.href='feed.html'">← feed</button>
    </div>

    <div class="content-wrapper">
        <div class="host-page">
            <div class="host-header">
                <h1 class="host-title" style="font-family: var(--font-heading); font-weight:800; color:#ff2d2d;">host fun</h1>
                <p class="host-subtitle" style="font-family: var(--font-mono); opacity:0.8;">list your fun for people to discover</p>
            </div>

            <div class="glass-form">
                <form class="form-grid" id="hostForm">
                    <div class="form-group">
                        <label class="form-label">fun name</label>
                        <input type="text" class="glass-input" id="partyName" placeholder="e.g. Rooftop Rave" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">date</label>
                            <input type="date" class="glass-input" id="partyDate" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">time</label>
                            <input type="time" class="glass-input" id="partyTime" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">location</label>
                        <input type="text" class="glass-input" id="partyLocation" placeholder="Search for a location..." required>
                        <div id="mapPicker" style="width:100%; height:200px; border-radius:12px; margin-top:0.5rem; border:1px solid rgba(255,45,45,0.4);"></div>
                        <input type="hidden" id="partyLat" required>
                        <input type="hidden" id="partyLng" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">vibe</label>
                            <select class="glass-input glass-select" id="partyVibe">
                                <option value="chill">chill 🧊</option>
                                <option value="hype">hype 🔥</option>
                                <option value="lowkey">lowkey 🤫</option>
                                <option value="festival">festival 🎪</option>
                                <option value="kickback">kickback 🌙</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">max people</label>
                            <input type="number" class="glass-input" id="partyCapacity" placeholder="50" min="2" max="5000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">description</label>
                        <textarea class="glass-input glass-textarea" id="partyDesc" placeholder="what should people know? dress code, what to bring, vibe check..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn" style="background:#ff2d2d; color:#000; text-transform:lowercase; border-radius:50px;">publish fun 🚀</button>
                </form>
            </div>

            <div class="section-divider">
                <span>your fun</span>
            </div>

            <div class="hosted-list" id="hostedList">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { collection, query, getDocs, doc, addDoc, updateDoc, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        let currentUser = null;
        let currentUserProfileName = "NXUS Host";
        let map, marker, autocomplete;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                currentUserProfileName = user.displayName || user.email.split('@')[0];
                await renderHosted();
            } else {
                window.location.href = 'index.html';
            }
        });

        // Initialize Map
        window.onload = function() {
            map = new google.maps.Map(document.getElementById("mapPicker"), {
                center: { lat: 25.2048, lng: 55.2708 }, // Dubai Default
                zoom: 12,
                disableDefaultUI: true,
                styles: [
                    { elementType: "geometry", stylers: [{ color: "#111111" }] },
                    { elementType: "labels.text.stroke", stylers: [{ color: "#111111" }] },
                    { elementType: "labels.text.fill", stylers: [{ color: "#ff2d2d" }] },
                    { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#ff2d2d" }] },
                    { featureType: "road", elementType: "geometry", stylers: [{ color: "#222222" }] },
                    { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#333333" }] },
                ]
            });

            marker = new google.maps.Marker({
                map: map,
                draggable: true
            });

            const input = document.getElementById("partyLocation");
            autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo("bounds", map);

            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) return;

                if (place.geometry.viewport) map.fitBounds(place.geometry.viewport);
                else { map.setCenter(place.geometry.location); map.setZoom(17); }

                marker.setPosition(place.geometry.location);
                updateLatLngFields(place.geometry.location);
            });

            map.addListener("click", (e) => {
                marker.setPosition(e.latLng);
                updateLatLngFields(e.latLng);
            });

            marker.addListener("dragend", () => updateLatLngFields(marker.getPosition()));
        };

        function updateLatLngFields(latlng) {
            document.getElementById('partyLat').value = latlng.lat();
            document.getElementById('partyLng').value = latlng.lng();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function formatDateTime(date, time) {
            const d = new Date(date + 'T' + time);
            const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            const day = days[d.getDay()];
            const month = months[d.getMonth()];
            const dateNum = d.getDate();
            let hours = d.getHours();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12 || 12;
            const mins = d.getMinutes();
            const timeStr = mins > 0 ? `${hours}:${String(mins).padStart(2, '0')}${ampm}` : `${hours}${ampm}`;
            return `${day} ${month} ${dateNum} @ ${timeStr}`;
        }

        async function renderHosted() {
            const list = document.getElementById('hostedList');
            list.innerHTML = '<div class="empty-hosted"><p style="font-family:var(--font-mono); opacity:0.5;">loading your events...</p></div>';

            try {
                // Query events hosted by currentUser
                const eventsSnap = await getDocs(query(collection(db, "events"), where("hostUid", "==", currentUser.uid)));
                const parties = [];
                eventsSnap.forEach(doc => parties.push({ id: doc.id, ...doc.data() }));

                if (parties.length === 0) {
                    list.innerHTML = `
                        <div class="empty-hosted">
                            <p>🎉</p>
                            <h3 style="font-family: var(--font-heading); color:#ff2d2d;">no fun yet</h3>
                            <p style="font-family: var(--font-mono); opacity:0.6;">create one above and it'll show up on people's feeds</p>
                        </div>`;
                    return;
                }

                list.textContent = '';
                parties.reverse(); // Newest locally if sorted by addition implicitly

                for (const p of parties) {
                    // Fetch join requests for this event
                    const reqSnap = await getDocs(query(collection(db, "joinRequests"), where("eventId", "==", p.id)));
                    const requests = [];
                    reqSnap.forEach(r => requests.push({ id: r.id, ...r.data() }));

                    const pendingReqs = requests.filter(r => r.status === 'pending');
                    const acceptedReqs = requests.filter(r => r.status === 'accepted');

                    const card = document.createElement('div');
                    card.className = 'hosted-card';

                    const top = document.createElement('div');
                    top.className = 'hosted-top';

                    const title = document.createElement('span');
                    title.className = 'hosted-title';
                    title.style.fontFamily = 'var(--font-heading)';
                    title.textContent = p.name || '';

                    const live = document.createElement('span');
                    live.className = 'hosted-live';
                    live.style.background = 'rgba(255,45,45,0.1)';
                    live.style.borderColor = 'rgba(255,45,45,0.3)';
                    live.textContent = 'live';

                    top.appendChild(title);
                    top.appendChild(live);

                    const time = document.createElement('div');
                    time.className = 'hosted-time';
                    time.style.fontFamily = 'var(--font-mono)';
                    time.textContent = p.displayTime || '';

                    const meta = document.createElement('div');
                    meta.className = 'hosted-meta';
                    meta.style.fontFamily = 'var(--font-mono)';

                    const location = document.createElement('span');
                    location.style.color = 'rgba(255,255,255,0.5)';
                    location.textContent = `📍 ${p.location || ''}`;
                    meta.appendChild(location);

                    const vibe = document.createElement('span');
                    vibe.style.color = 'rgba(255,255,255,0.5)';
                    vibe.textContent = p.vibe || '';
                    meta.appendChild(vibe);

                    if (p.capacity) {
                        const cap = document.createElement('span');
                        cap.style.color = 'rgba(255,255,255,0.5)';
                        cap.textContent = `👥 max ${p.capacity}`;
                        meta.appendChild(cap);
                    }

                    const desc = document.createElement('p');
                    desc.className = 'hosted-desc';
                    desc.style.fontFamily = 'var(--font-mono)';
                    desc.textContent = p.desc || '';

                    const stats = document.createElement('div');
                    stats.className = 'hosted-stats';
                    stats.innerHTML = `
                        <div class="stat"><strong style="font-family:var(--font-heading); color:#ff2d2d;">${requests.length}</strong>interested</div>
                        <div class="stat"><strong style="font-family:var(--font-heading); color:#ff2d2d;">${acceptedReqs.length}</strong>accepted</div>
                    `;

                    card.appendChild(top);
                    card.appendChild(time);
                    card.appendChild(meta);
                    card.appendChild(desc);
                    card.appendChild(stats);

                    // Dashboard requests section
                    if (pendingReqs.length > 0) {
                        const reqHeader = document.createElement('div');
                        reqHeader.style.marginTop = '1rem';
                        reqHeader.style.paddingTop = '1rem';
                        reqHeader.style.borderTop = '1px solid rgba(255,45,45,0.1)';
                        reqHeader.innerHTML = '<span style="font-family:var(--font-mono); color:#ff2d2d; font-size:0.75rem;">pending requests</span>';
                        card.appendChild(reqHeader);

                        pendingReqs.forEach(req => {
                            const reqDiv = document.createElement('div');
                            reqDiv.className = 'request-item';
                            
                            const reqName = document.createElement('span');
                            reqName.style.fontFamily = 'var(--font-mono)';
                            reqName.style.fontSize = '0.8rem';
                            reqName.textContent = req.userDisplayName || 'Anonymous User';

                            const actions = document.createElement('div');
                            actions.style.display = 'flex';
                            actions.style.gap = '8px';

                            const acceptBtn = document.createElement('button');
                            acceptBtn.textContent = '✓ accept';
                            acceptBtn.style.cssText = 'background:transparent; border:1px solid #4ade80; color:#4ade80; padding:0.2rem 0.6rem; border-radius:50px; cursor:pointer; font-family:var(--font-mono); font-size:0.7rem;';
                            acceptBtn.onclick = () => updateReqStatus(req.id, 'accepted');

                            const declineBtn = document.createElement('button');
                            declineBtn.textContent = '✕ decline';
                            declineBtn.style.cssText = 'background:transparent; border:1px solid rgba(255,45,45,0.5); color:#ff2d2d; padding:0.2rem 0.6rem; border-radius:50px; cursor:pointer; font-family:var(--font-mono); font-size:0.7rem;';
                            declineBtn.onclick = () => updateReqStatus(req.id, 'declined');

                            actions.appendChild(acceptBtn);
                            actions.appendChild(declineBtn);
                            reqDiv.appendChild(reqName);
                            reqDiv.appendChild(actions);

                            card.appendChild(reqDiv);
                        });
                    }

                    list.appendChild(card);
                }
            } catch(e) {
                console.error("Error loading host dashboard:", e);
                list.innerHTML = '<div class="empty-hosted"><p>error loading your events.</p></div>';
            }
        }

        window.updateReqStatus = async function(reqId, status) {
            try {
                await updateDoc(doc(db, "joinRequests", reqId), { status: status });
                showToast(`Request ${status}!`);
                renderHosted(); // refresh live list
            } catch(e) {
                console.error("Error updating req", e);
                showToast('Failed to update.');
            }
        }

        // Form submit
        document.getElementById('hostForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('partyName').value.trim();
            const date = document.getElementById('partyDate').value;
            const time = document.getElementById('partyTime').value;
            const location = document.getElementById('partyLocation').value.trim();
            const vibe = document.getElementById('partyVibe').value;
            const capacity = document.getElementById('partyCapacity').value;
            const desc = document.getElementById('partyDesc').value.trim();
            const lat = document.getElementById('partyLat').value;
            const lng = document.getElementById('partyLng').value;

            if (!name || !date || !time || !location || !desc || !lat || !lng) {
                showToast("Please drop a pin on the map!");
                return;
            }

            const vibeEmojis = {
                chill: '🧊 chill',
                hype: '🔥 hype',
                lowkey: '🤫 lowkey',
                festival: '🎪 festival',
                kickback: '🌙 kickback'
            };

            const partyData = {
                hostUid: currentUser.uid,
                hostCircle: currentUserProfileName,
                name: name,
                date: date,
                time: time,
                displayTime: formatDateTime(date, time),
                location: location,
                vibe: vibeEmojis[vibe],
                capacity: capacity || null,
                desc: desc,
                lat: parseFloat(lat),
                lng: parseFloat(lng),
                createdAt: serverTimestamp()
            };

            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.textContent = 'publishing...';
            submitBtn.disabled = true;

            try {
                await addDoc(collection(db, "events"), partyData);
                e.target.reset();
                showToast('fun published! 🎉');
                document.querySelector('.section-divider').scrollIntoView({ behavior: 'smooth' });
                await renderHosted();
            } catch (err) {
                console.error("Error adding doc:", err);
                showToast('Publish failed.');
            } finally {
                submitBtn.textContent = 'publish fun 🚀';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
