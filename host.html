<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="nxus-ga-measurement-id" content="G-30KZZMNYKN">
    <script src="analytics.js" defer></script>
    <title>NXUS | Host a Party</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        body { background: #0a0e1a; overflow-x: hidden; }

        .river-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 80%, rgba(30, 58, 138, 0.5) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 75% 20%, rgba(234, 88, 12, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse 90% 60% at 50% 50%, rgba(15, 23, 42, 0.8) 0%, transparent 80%),
                radial-gradient(ellipse 40% 80% at 10% 30%, rgba(30, 64, 175, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse 50% 70% at 90% 70%, rgba(217, 119, 6, 0.25) 0%, transparent 55%),
                linear-gradient(160deg, #0a0e1a 0%, #0f172a 30%, #1a0f0a 60%, #0d1321 100%);
        }
        .river-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 120% 15% at 30% 85%, rgba(30, 64, 175, 0.35) 0%, transparent 70%),
                radial-gradient(ellipse 100% 12% at 70% 15%, rgba(234, 88, 12, 0.2) 0%, transparent 60%);
            filter: blur(30px);
        }
        .river-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(5, 8, 15, 0.7) 100%);
        }

        /* Nav */
        .feed-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(10, 14, 26, 0.9), transparent);
            z-index: 20;
            pointer-events: none;
        }
        .feed-nav * { pointer-events: auto; }

        .nav-logo {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 0.1em;
            cursor: pointer;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        /* Page */
        .host-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            gap: 1.2rem;
        }

        .host-header { text-align: center; margin-bottom: 0.3rem; }
        .host-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(2rem, 6vw, 2.8rem);
            color: #fff;
            letter-spacing: 0.1em;
        }
        .host-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.05em;
            margin-top: 0.3rem;
        }

        /* Glass form panel */
        .glass-form {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            overflow: hidden;
        }
        .glass-form::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            pointer-events: none;
        }
        .glass-form::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.06) 0%, transparent 12%);
            pointer-events: none;
        }
        .glass-form > * { position: relative; z-index: 1; }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-row {
            display: flex;
            gap: 0.8rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1;
        }

        .form-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.05em;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            padding: 0.75rem 1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 0 0 0.5px rgba(255,255,255,0.05) inset;
        }
        .glass-input:focus {
            border-color: rgba(234, 88, 12, 0.5);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.1);
        }
        .glass-input::placeholder { color: rgba(255,255,255,0.25); }

        .glass-textarea {
            resize: none;
            min-height: 90px;
            line-height: 1.5;
        }

        .glass-select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='rgba(255,255,255,0.4)' stroke-width='1.5'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            padding-right: 2.5rem;
        }

        .submit-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }
        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .submit-btn:active { transform: translateY(1px); }

        /* Hosted parties list */
        .section-divider {
            display: flex;
            align-items: center;
            width: 100%;
            color: rgba(255,255,255,0.2);
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            font-family: 'Space Mono', monospace;
        }
        .section-divider::before, .section-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .section-divider span { padding: 0 12px; }

        .hosted-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
        }

        .hosted-card {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 1.3rem 1.4rem;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .hosted-card::before {
            content: '';
            position: absolute;
            top: 0; left: 8%; right: 8%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }
        .hosted-card:hover { border-color: rgba(255,255,255,0.18); }

        .hosted-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.4rem;
        }
        .hosted-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            color: #fff;
        }

        .hosted-live {
            font-family: 'Space Mono', monospace;
            font-size: 0.6rem;
            padding: 0.25rem 0.6rem;
            border-radius: 50px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #4ade80;
            letter-spacing: 0.08em;
            flex-shrink: 0;
            margin-left: 0.8rem;
        }

        .hosted-time {
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            color: var(--accent);
            letter-spacing: 0.08em;
            margin-bottom: 0.3rem;
        }

        .hosted-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
        }

        .hosted-desc {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-top: 0.5rem;
            line-height: 1.5;
        }

        .hosted-stats {
            display: flex;
            gap: 1.2rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .stat {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.35);
        }
        .stat strong {
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            display: block;
            margin-bottom: 0.15rem;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            color: rgba(239, 68, 68, 0.5);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 0.35rem 0.7rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.8rem;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* Empty state */
        .empty-hosted {
            text-align: center;
            padding: 2rem;
            font-family: 'Space Mono', monospace;
        }
        .empty-hosted p:first-child { font-size: 2rem; margin-bottom: 0.5rem; }
        .empty-hosted h3 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 0.4rem;
        }
        .empty-hosted p:last-child {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 0.8rem 2rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: #fff;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .feed-nav { padding: 1rem; }
            .host-page { max-width: 94%; }
            .glass-form { padding: 1.5rem; border-radius: 20px; }
            .form-row { flex-direction: column; gap: 1rem; }
            .hosted-card { padding: 1.1rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="river-bg"></div>

    <div class="feed-nav">
        <span class="nav-logo" onclick="window.location.href='feed.html'">NXUS</span>
        <button class="nav-btn" onclick="window.location.href='feed.html'">← feed</button>
    </div>

    <div class="content-wrapper">
        <div class="host-page">
            <div class="host-header">
                <h1 class="host-title">host fun</h1>
                <p class="host-subtitle">list your fun for people to discover</p>
            </div>

            <div class="glass-form">
                <form class="form-grid" id="hostForm">
                    <div class="form-group">
                        <label class="form-label">fun name</label>
                        <input type="text" class="glass-input" id="partyName" placeholder="e.g. Rooftop Rave" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">date</label>
                            <input type="date" class="glass-input" id="partyDate" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">time</label>
                            <input type="time" class="glass-input" id="partyTime" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">location</label>
                        <input type="text" class="glass-input" id="partyLocation" placeholder="e.g. Terrace, North Campus Hostel" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">vibe</label>
                            <select class="glass-input glass-select" id="partyVibe">
                                <option value="chill">chill 🧊</option>
                                <option value="hype">hype 🔥</option>
                                <option value="lowkey">lowkey 🤫</option>
                                <option value="festival">festival 🎪</option>
                                <option value="kickback">kickback 🌙</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">max people</label>
                            <input type="number" class="glass-input" id="partyCapacity" placeholder="50" min="2" max="5000">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">description</label>
                        <textarea class="glass-input glass-textarea" id="partyDesc" placeholder="what should people know? dress code, what to bring, vibe check..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">publish fun 🚀</button>
                </form>
            </div>

            <div class="section-divider">
                <span>your fun</span>
            </div>

            <div class="hosted-list" id="hostedList">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function getHostedParties() {
            return JSON.parse(localStorage.getItem('nxus_hosted') || '[]');
        }

        function saveHostedParties(parties) {
            localStorage.setItem('nxus_hosted', JSON.stringify(parties));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function formatDateTime(date, time) {
            const d = new Date(date + 'T' + time);
            const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
            const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
            const day = days[d.getDay()];
            const month = months[d.getMonth()];
            const dateNum = d.getDate();
            let hours = d.getHours();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12 || 12;
            const mins = d.getMinutes();
            const timeStr = mins > 0 ? `${hours}:${String(mins).padStart(2, '0')}${ampm}` : `${hours}${ampm}`;
            return `${day} ${month} ${dateNum} @ ${timeStr}`;
        }

        function renderHosted() {
            const list = document.getElementById('hostedList');
            const parties = getHostedParties();

            if (parties.length === 0) {
                list.textContent = '';

                const empty = document.createElement('div');
                empty.className = 'empty-hosted';

                const p1 = document.createElement('p');
                p1.textContent = '🎉';

                const h = document.createElement('h3');
                h.textContent = 'no fun yet';

                const p2 = document.createElement('p');
                p2.textContent = "create one above and it'll show up on people's feeds";

                empty.appendChild(p1);
                empty.appendChild(h);
                empty.appendChild(p2);
                list.appendChild(empty);
                return;
            }

            list.textContent = '';

            parties.forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'hosted-card';

                const top = document.createElement('div');
                top.className = 'hosted-top';

                const title = document.createElement('span');
                title.className = 'hosted-title';
                title.textContent = p.name || '';

                const live = document.createElement('span');
                live.className = 'hosted-live';
                live.textContent = 'live';

                top.appendChild(title);
                top.appendChild(live);

                const time = document.createElement('div');
                time.className = 'hosted-time';
                time.textContent = p.displayTime || '';

                const meta = document.createElement('div');
                meta.className = 'hosted-meta';

                const location = document.createElement('span');
                location.style.color = 'rgba(255,255,255,0.4)';
                location.textContent = `📍 ${p.location || ''}`;
                meta.appendChild(location);

                const vibe = document.createElement('span');
                vibe.style.color = 'rgba(255,255,255,0.4)';
                vibe.textContent = p.vibe || '';
                meta.appendChild(vibe);

                if (p.capacity) {
                    const cap = document.createElement('span');
                    cap.style.color = 'rgba(255,255,255,0.4)';
                    cap.textContent = `👥 max ${p.capacity}`;
                    meta.appendChild(cap);
                }

                const desc = document.createElement('p');
                desc.className = 'hosted-desc';
                desc.textContent = p.desc || '';

                const stats = document.createElement('div');
                stats.className = 'hosted-stats';

                const views = document.createElement('div');
                views.className = 'stat';
                const viewsStrong = document.createElement('strong');
                viewsStrong.textContent = String(Math.floor(Math.random() * 40) + 5);
                views.appendChild(viewsStrong);
                views.appendChild(document.createTextNode('views'));

                const interested = document.createElement('div');
                interested.className = 'stat';
                const interestedStrong = document.createElement('strong');
                interestedStrong.textContent = String(Math.floor(Math.random() * 15) + 1);
                interested.appendChild(interestedStrong);
                interested.appendChild(document.createTextNode('interested'));

                const accepted = document.createElement('div');
                accepted.className = 'stat';
                const acceptedStrong = document.createElement('strong');
                acceptedStrong.textContent = String(Math.floor(Math.random() * 8));
                accepted.appendChild(acceptedStrong);
                accepted.appendChild(document.createTextNode('accepted'));

                stats.appendChild(views);
                stats.appendChild(interested);
                stats.appendChild(accepted);

                const btn = document.createElement('button');
                btn.className = 'delete-btn';
                btn.type = 'button';
                btn.textContent = 'remove listing';
                btn.addEventListener('click', () => deleteParty(i));

                card.appendChild(top);
                card.appendChild(time);
                card.appendChild(meta);
                card.appendChild(desc);
                card.appendChild(stats);
                card.appendChild(btn);

                list.appendChild(card);
            });
        }

        function deleteParty(index) {
            const parties = getHostedParties();
            parties.splice(index, 1);
            saveHostedParties(parties);
            renderHosted();
            showToast('fun removed 👋');
        }

        // Form submit
        document.getElementById('hostForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('partyName').value.trim();
            const date = document.getElementById('partyDate').value;
            const time = document.getElementById('partyTime').value;
            const location = document.getElementById('partyLocation').value.trim();
            const vibe = document.getElementById('partyVibe').value;
            const capacity = document.getElementById('partyCapacity').value;
            const desc = document.getElementById('partyDesc').value.trim();

            if (!name || !date || !time || !location || !desc) return;

            const vibeEmojis = {
                chill: '🧊 chill',
                hype: '🔥 hype',
                lowkey: '🤫 lowkey',
                festival: '🎪 festival',
                kickback: '🌙 kickback'
            };

            const party = {
                name,
                date,
                time,
                displayTime: formatDateTime(date, time),
                location,
                vibe: vibeEmojis[vibe],
                capacity: capacity || null,
                desc,
                createdAt: new Date().toISOString()
            };

            const parties = getHostedParties();
            parties.unshift(party);
            saveHostedParties(parties);

            e.target.reset();
            renderHosted();
            showToast('fun published! 🎉');

            // Scroll to the list
            document.querySelector('.section-divider').scrollIntoView({ behavior: 'smooth' });
        });

        // Initial render
        renderHosted();
    </script>
</body>
</html>
