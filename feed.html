<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXUS | Feed</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .feed-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-top: 4rem;
        }
        
        /* Swipe UI Setup */
        .swipe-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 600px;
            margin: 2rem auto;
            perspective: 1000px;
        }

        .party-card {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem 2.5rem;
            cursor: grab;
            touch-action: none;
            transform-origin: 50% 100%;
            user-select: none;
            -webkit-user-select: none;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px 0 rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(59, 130, 246, 0.1);
            border-radius: 12px;
            text-align: left;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Ensure pointer events are allowed naturally, JS controls them */
        }
        
        .party-card:active {
            cursor: grabbing;
        }

        .card-title {
            font-size: clamp(2rem, 5vw, 2.8rem);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
            line-height: 1.1;
        }

        .card-time {
            color: var(--accent);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
        }

        .card-desc {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .hint {
            position: absolute;
            font-family: 'Space Mono', monospace;
            font-size: 2rem;
            font-weight: bold;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            opacity: 0;
            z-index: 100;
            pointer-events: none;
            letter-spacing: 0.2em;
        }

        .hint-like {
            top: 2rem; right: 1rem;
            color: #4ade80;
            border: 4px solid #4ade80;
            transform: rotate(15deg);
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
        }

        .hint-dislike {
            top: 2rem; left: 1rem;
            color: #ef4444;
            border: 4px solid #ef4444;
            transform: rotate(-15deg);
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        /* Nav override */
        .feed-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(5, 10, 18, 0.9), transparent);
            z-index: 20;
            pointer-events: none;
        }
        
        .feed-nav * {
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .feed-nav {
                padding: 1rem 1rem;
            }

            .feed-container {
                padding-top: 2rem;
            }

            .swipe-container {
                max-width: 90vw;
                height: 480px;
                margin: 1.5rem auto;
            }

            .party-card {
                padding: 2rem 1.5rem;
            }

            .card-title {
                font-size: clamp(1.6rem, 6vw, 2.2rem);
            }

            .card-time {
                font-size: 0.8rem;
                margin-bottom: 1rem;
            }

            .card-desc {
                font-size: 1rem;
                line-height: 1.5;
            }

            .hint {
                font-size: 1.5rem;
                padding: 0.4rem 1rem;
            }
        }

        @media (max-width: 400px) {
            .swipe-container {
                height: 420px;
            }

            .party-card {
                padding: 1.5rem 1.2rem;
            }

            .card-desc {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    
    <div class="feed-nav">
        <h2 class="logo-text" style="font-size: 2rem; text-shadow: none;">NXUS</h2>
        <button class="btn-redacta" style="padding: 0.5rem 1.5rem; font-size: 0.9rem;" onclick="window.location.href='settings.html'">⚙ Settings</button>
    </div>

    <div class="content-wrapper">
        <div class="feed-container">
            <h1 class="logo-text" style="font-size: 1.8rem; margin: 0; opacity: 0.5;">RADAR</h1>
            <p class="subtitle" style="font-size: 0.8rem; margin-top: 0.5rem; margin-bottom: 0;">SWIPE LEFT TO LIKE // RIGHT TO DISMISS</p>
            
            <div class="swipe-container" id="swipeContainer">
                <!-- Cards injected here via JS -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Swiping Logic
        const container = document.getElementById('swipeContainer');
        const cardsData = [
            { 
                title: "Freshers Bash", 
                time: "FRI MAR 28 @ 9PM", 
                host: "Delta Kappa",
                location: "South Campus Block C Terrace",
                people: "127 going",
                desc: "The official welcome party for the new batch. Free entry for first-years, DJ Arjun spinning Bollywood x EDM all night. BYOB after 11." 
            },
            { 
                title: "Sunburn Pregame", 
                time: "SAT MAR 29 @ 7PM",
                host: "Rahul & Sneha",
                location: "Rahul's Flat, Hauz Khas",
                people: "43 going",
                desc: "Chill pregame before everyone heads to Sunburn afterparty at Kitty Su. Drinks sorted, just bring good vibes. Uber pool from here at 11." 
            },
            { 
                title: "Acoustic Night", 
                time: "THU MAR 27 @ 8PM",
                host: "Music Society",
                location: "Open Air Theatre",
                people: "89 going",
                desc: "Unplugged performances by campus bands, chai and maggi stalls, fairy lights on the lawn. Chill one before end-sems hit." 
            },
            { 
                title: "Holi Rave", 
                time: "SAT APR 5 @ 11AM",
                host: "Cultural Committee",
                location: "Sports Ground",
                people: "312 going",
                desc: "Organic colours, rain dance, live dhol, and thandai bar. Wear whites. After-party at someone's farmhouse TBD." 
            },
            { 
                title: "Rooftop Kickback", 
                time: "TONIGHT @ 10PM",
                host: "Aman's Circle",
                location: "PG Rooftop, Vijay Nagar",
                people: "18 going",
                desc: "Small gathering, good music, cold ones on the roof. Keep it lowkey — no stories. DM for address." 
            },
            { 
                title: "FIFA Tournament", 
                time: "SUN MAR 30 @ 3PM",
                host: "Gaming Club",
                location: "Common Room, Hostel 4",
                people: "32 going",
                desc: "₹100 entry, winner takes the pool. PS5 on the projector, snacks provided. Losing team buys chai for everyone." 
            }
        ];

        // Render stacked cards
        cardsData.reverse().forEach((data, index) => {
            const card = document.createElement('div');
            card.className = 'party-card';
            card.innerHTML = `
                <span class="hint hint-like">LIKE</span>
                <span class="hint hint-dislike">NOPE</span>
                <div class="card-content">
                    <h2 class="logo-text card-title">${data.title}</h2>
                    <p class="subtitle card-time">${data.time}</p>
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.8rem;">
                        <span style="font-size: 0.8rem; color: #93c5fd; opacity: 0.9;">📍 ${data.location}</span>
                        <span style="font-size: 0.8rem; color: #4ade80;">👥 ${data.people}</span>
                    </div>
                    <p class="card-desc">${data.desc}</p>
                    <p style="margin-top: 1rem; font-size: 0.8rem; color: #64748b; letter-spacing: 0.05em;">Hosted by <span style="color: #fdba74;">${data.host}</span></p>
                </div>
            `;
            container.appendChild(card);
        });

        let cards = Array.from(document.querySelectorAll('.party-card'));

        function initTopCard() {
            if (cards.length === 0) {
                container.innerHTML = `
                    <div class="glass-panel" style="padding: 3rem; text-align: center; height: 100%; display: flex; flex-direction: column; justify-content: center;">
                        <h2 class="logo-text" style="font-size: 2.5rem; color: #fff;">RADAR EMPTY</h2>
                        <p style="color: #93c5fd; letter-spacing: 0.1em; margin-top: 1rem;">No more parties. Check back later.</p>
                    </div>`;
                return;
            }

            cards.forEach((card, i) => {
                const isTopCard = (i === cards.length - 1);
                // Reverse index: distances from top (0 = top, 1 = second, etc)
                const depth = cards.length - 1 - i;
                
                card.style.zIndex = i;
                if (isTopCard) {
                    card.style.transform = `scale(1) translateY(0px)`;
                    card.style.opacity = 1;
                    setupDrag(card);
                } else {
                    // Depths logic
                    card.style.transform = `scale(${1 - depth * 0.04}) translateY(${depth * 15}px)`;
                    card.style.opacity = depth > 3 ? 0 : 1 - depth * 0.15; // fade out deep cards
                    card.style.pointerEvents = 'none'; // Only interact with top card
                }
            });
        }

        function setupDrag(card) {
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let isDragging = false;
            
            card.style.pointerEvents = 'auto';

            card.addEventListener('pointerdown', (e) => {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                card.style.transition = 'none';
                card.setPointerCapture(e.pointerId);
            });
            
            card.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;
                const rotate = currentX * 0.04;
                card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;
                
                const likeHint = card.querySelector('.hint-like');
                const dislikeHint = card.querySelector('.hint-dislike');
                
                // Left means Like, Right means Dislike
                if (currentX < 0) {
                    likeHint.style.opacity = Math.min(Math.abs(currentX) / 80, 1);
                    dislikeHint.style.opacity = 0;
                } else {
                    dislikeHint.style.opacity = Math.min(currentX / 80, 1);
                    likeHint.style.opacity = 0;
                }
            });
            
            const resetCard = () => {
                if (!isDragging) return;
                isDragging = false;
                
                const throwOutThreshold = window.innerWidth * 0.20; // 20% of screen
                
                if (currentX < -throwOutThreshold) {
                    // Swiped Left = LIKE
                    flyOut(card, -window.innerWidth - 200, currentY, -30);
                } else if (currentX > throwOutThreshold) {
                    // Swiped Right = DISLIKE
                    flyOut(card, window.innerWidth + 200, currentY, 30);
                } else {
                    // Snap back
                    card.style.transition = 'transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.transform = 'scale(1) translateY(0px)';
                    card.querySelector('.hint-like').style.opacity = 0;
                    card.querySelector('.hint-dislike').style.opacity = 0;
                    currentX = 0; currentY = 0;
                }
            };

            card.addEventListener('pointerup', resetCard);
            card.addEventListener('pointercancel', resetCard);
        }

        function flyOut(card, destX, destY, destRot) {
            card.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease';
            card.style.transform = `translate(${destX}px, ${destY}px) rotate(${destRot}deg)`;
            card.style.opacity = 0;
            
            setTimeout(() => {
                card.remove();
                cards.pop();
                initTopCard(); // Reinitialize next card
            }, 300);
        }

        window.addEventListener('load', initTopCard);
    </script>
</body>
</html>
