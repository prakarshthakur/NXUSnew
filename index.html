<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="nxus-ga-measurement-id" content="G-30KZZMNYKN">
    <script src="analytics.js" defer></script>
    <meta name="description" content="NXUS - Fun. For Everyone.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <title>NXUS | Fun. For Everyone.</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ===== Login Page Overrides ===== */
        body.login-page {
            background: #000000;
            overflow-x: hidden;
            color: #ff0000;
        }

        /* Static river background */
        .river-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            background: #000000;
        }

        .river-bg::before, .river-bg::after {
            display: none;
        }

        /* ===== Red Glass ===== */
        .liquid-glass {
            position: relative;
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            padding: 3rem 2.5rem;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .liquid-glass::before, .liquid-glass::after {
            display: none;
        }

        .liquid-glass > * {
            position: relative;
            z-index: 1;
        }

        /* Glass input */
        .glass-input {
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            padding: 0.85rem 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        .glass-input:focus {
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 10px #ff0000;
        }

        .glass-input::placeholder {
            color: rgba(255, 0, 0, 0.5);
        }

        /* Glass button */
        .glass-btn {
            background: #ff0000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #000000;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .glass-btn:hover {
            background: #cc0000;
            box-shadow: 0 0 20px #ff0000;
            color: #000000;
        }

        /* Glass social button */
        .glass-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
        }

        .glass-social:hover {
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 10px #ff0000;
        }

        /* Glass icon button */
        .glass-icon-btn {
            position: absolute;
            background: #000000;
            border: 1px solid #ff0000;
            width: 34px; height: 34px;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            color: #ff0000;
        }

        .glass-icon-btn:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Tabs */
        .glass-tabs {
            display: flex;
            background: #000000;
            border: 1px solid #ff0000;
            padding: 0;
            gap: 0;
            width: 100%;
        }

        .glass-tab {
            flex: 1;
            background: transparent;
            border: none;
            border-right: 1px solid #ff0000;
            color: rgba(255, 0, 0, 0.5);
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            padding: 0.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            border-radius: 0;
            text-transform: uppercase;
        }

        .glass-tab:last-child {
            border-right: none;
        }

        .glass-tab.active {
            background: #ff0000;
            color: #000000;
            font-weight: bold;
        }

        /* Divider */
        .glass-divider {
            display: flex;
            align-items: center;
            width: 100%;
            color: #ff0000;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        .glass-divider::before,
        .glass-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ff0000;
        }

        .glass-divider span {
            padding: 0 12px;
            font-family: 'Oswald', sans-serif;
        }

        /* Labels */
        .glass-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            color: #ff0000;
            text-align: left;
            width: 100%;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Logo on login */
        .hero-logo {
            width: 140px;
            height: auto;
            margin-bottom: 0px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.8));
        }

        .login-tagline {
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            color: #ff0000;
            letter-spacing: 0.08em;
            margin-top: -0.5rem;
            text-transform: uppercase;
        }

        /* Form wrapper */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        /* Redacta nav pill */
        .nav-pill {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            z-index: 20;
        }

        .nav-pill button {
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-pill button:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Footer override */
        .login-footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 0, 0, 0.6);
            letter-spacing: 0.15em;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        /* Modal override */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000000;
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-glass {
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            padding: 2.5rem;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: modalIn 0.3s ease;
            position: relative;
            box-shadow: 0 0 20px #ff0000;
        }

        @keyframes modalIn {
            from { transform: scale(0.92) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Coming Soon Screen */
        #comingSoonScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .coming-soon-logo {
            width: 250px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.8));
        }

        .coming-soon-form {
            position: absolute;
            bottom: 3rem;
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 0 20px;
        }

        .coming-soon-form input {
            background: #000000;
            border: 1px solid #ff0000;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            padding: 0.8rem;
            text-align: center;
            outline: none;
            border-radius: 0;
        }

        .coming-soon-form input:focus {
            box-shadow: 0 0 10px #ff0000;
        }

        .coming-soon-form input::placeholder {
            color: rgba(255, 0, 0, 0.3);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .nav-pill.redacta-desktop { display: none !important; }
            .redacta-mobile { display: flex !important; }

            .liquid-glass {
                max-width: 92%;
                padding: 2.5rem 1.5rem;
                border-radius: 0;
            }

            .login-hero {
                font-size: clamp(2.8rem, 14vw, 4rem);
            }

            .login-tagline {
                font-size: 0.75rem;
            }

            .glass-input {
                font-size: 0.9rem;
            }

            .modal-glass {
                max-width: 85%;
                padding: 2rem 1.5rem;
            }

            .coming-soon-title {
                font-size: clamp(2.5rem, 12vw, 4rem);
            }
        }

        @media (max-width: 400px) {
            .liquid-glass {
                padding: 2rem 1.2rem;
                border-radius: 0;
            }
        }
    </style>
    <style>
        body { background: #000000 !important; }
        .river-bg, .river-bg::before, .river-bg::after, .old-river-bg-before { display: none !important; }
        .party-card, .detail-card, .glass-form, .liquid-glass, .hosted-card, .modal-glass, .empty-state, .glass-panel, .login-panel {
            background: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(40px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
            border: 1px solid rgba(255, 0, 0, 0.3) !important;
        }
    </style>
</head>
<body class="login-page">
    <!-- COMING SOON SCREEN -->
    <div id="comingSoonScreen">
        <img src="assets/nxus_logo.png" class="coming-soon-logo" alt="NXUS">
        <form id="unlockForm" class="coming-soon-form">
            <input type="password" id="unlockCode" placeholder="Enter Access Code">
        </form>
    </div>

    <div class="river-bg"></div>
    
    <div class="nav-pill redacta-desktop">
        <button onclick="window.location.href='https://redacta.nxus.fun'" data-tooltip="the easiest redaction tool ever">Try Redacta</button>
    </div>

    <div class="content-wrapper">
        <div class="liquid-glass" style="position: relative;">
            <button type="button" class="glass-icon-btn redacta-mobile" onclick="window.location.href='https://redacta.nxus.fun'" style="top: 1rem; left: 1rem; display: none; color: var(--accent); font-weight: bold;">R</button>
            <button type="button" class="glass-icon-btn" id="infoBtn" style="top: 1rem; right: 1rem;">i</button>

            <img src="assets/nxus_logo.png" class="hero-logo" alt="NXUS">
            <p class="login-tagline">ebay for fun.</p>

            <div class="glass-tabs" id="authTabs">
                <button type="button" class="glass-tab active" onclick="switchAuthMode('login')">log in</button>
                <button type="button" class="glass-tab" onclick="switchAuthMode('register')">sign up</button>
            </div>

            <form class="auth-form" id="authForm">
                <div class="input-row" id="nameGroup" style="display: none;">
                    <label class="glass-label" for="name">your name</label>
                    <input type="text" id="name" class="glass-input" placeholder="what do people call you?">
                </div>

                <div class="input-row">
                    <label class="glass-label" for="email">email</label>
                    <input type="email" id="email" class="glass-input" placeholder="you@college.edu" required>
                </div>
                
                <div class="input-row">
                    <label class="glass-label" for="password">password</label>
                    <input type="password" id="password" class="glass-input" placeholder="something secure pls" required>
                </div>
                
                <button type="submit" class="glass-btn" id="submitBtn">let's go →</button>

                <div class="glass-divider">
                    <span>or</span>
                </div>

                <div style="display: flex; flex-direction: column; gap: 0.6rem; width: 100%;">
                    <button type="button" class="glass-social" id="googleSignInBtn" style="padding: 0.4rem;">
                        <svg viewBox="0 0 24 24" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#ff0000" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#ff0000" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#ff0000" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#ff0000" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="login-footer">
        <p>by prakarsh thakur 2026</p>
    </footer>

    <!-- Info Modal -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal-glass">
            <p style="font-size: 2rem;">🎓</p>
            <h2 style="font-family: 'Oswald', sans-serif; font-size: 1.4rem; color: #fff; letter-spacing: 0.1em;">coming soon</h2>
            <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem; line-height: 1.6; font-family: 'Oswald', sans-serif;">university logins are on the way. soon you'll sign in directly with your college email.</p>
            <button class="glass-btn" style="margin-top: 0.5rem;" onclick="document.getElementById('infoModal').style.display='none';">got it ✓</button>
        </div>
    </div>

    <script type="module" src="firebase-auth.js"></script>
    <script>
        // Auth mode toggle
        function switchAuthMode(mode) {
            const subtitle = document.querySelector('.login-tagline');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('submitBtn');
            const nameInput = document.getElementById('name');
            const tabs = document.querySelectorAll('.glass-tab');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            
            if (mode === 'login') {
                subtitle.innerHTML = 'ebay for fun.';
                nameGroup.style.display = 'none';
                nameInput.removeAttribute('required');
                submitBtn.innerText = "let's go →";
                tabs[0].classList.add('active');
            } else {
                subtitle.innerHTML = 'ebay for fun.';
                nameGroup.style.display = 'flex';
                nameInput.setAttribute('required', 'true');
                submitBtn.innerText = "create account →";
                tabs[1].classList.add('active');
            }
        }

        // Info modal
        document.getElementById('infoBtn').addEventListener('click', () => {
            document.getElementById('infoModal').style.display = 'flex';
        });
        document.getElementById('infoModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('infoModal')) {
                document.getElementById('infoModal').style.display = 'none';
            }
        });
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(function(err){ console.log("SW registration failed", err); });
      }

      // Coming Soon Logic
      document.getElementById('unlockForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const codeInput = document.getElementById('unlockCode');
          if (codeInput.value === 'MAKEDUBAIGREATAGAIN') {
              document.getElementById('comingSoonScreen').style.display = 'none';
          } else {
              codeInput.value = '';
              codeInput.placeholder = 'ACCESS DENIED';
              setTimeout(() => {
                  codeInput.placeholder = 'Enter Access Code';
              }, 2000);
          }
      });
    </script>
</body>
</html>
