<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NXUS - Parties. For Everyone.">
    <title>NXUS | Parties. For Everyone.</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="particleCanvas"></canvas>
    
    <div class="top-nav redacta-desktop" style="position: fixed; top: 2rem; right: 2rem; z-index: 10;">
        <button class="btn-redacta" style="padding: 0.6rem 1.8rem; font-size: 1rem; border-bottom: 2px solid var(--accent); background: rgba(30, 58, 138, 0.4);" onclick="window.location.href='https://redacta.nxus.fun'" data-tooltip="the easiest redaction tool ever">Try Redacta</button>
    </div>

    <div class="content-wrapper">
        <div class="glass-panel login-panel" style="position: relative;">
            <button type="button" class="redacta-mobile" onclick="window.location.href='https://redacta.nxus.fun'" style="position: absolute; top: 1rem; left: 1rem; display: none; background: rgba(30, 58, 138, 0.4); border: 1.5px solid rgba(147, 197, 253, 0.4); color: var(--accent); font-family: 'Share Tech Mono', monospace; font-size: 1rem; font-weight: bold; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: all 0.3s ease; z-index: 10; align-items: center; justify-content: center;">R</button>
            <button type="button" id="infoBtn" style="position: absolute; top: 1rem; right: 1rem; background: transparent; border: 1.5px solid rgba(147, 197, 253, 0.4); color: #93c5fd; font-family: 'Space Mono', monospace; font-size: 1rem; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: all 0.3s ease; z-index: 10; display: flex; align-items: center; justify-content: center;" onmouseover="this.style.background='rgba(30,58,138,0.4)'; this.style.borderColor='rgba(147,197,253,0.7)';" onmouseout="this.style.background='transparent'; this.style.borderColor='rgba(147,197,253,0.4)';">i</button>
            <h1 class="logo-text login-logo">NXUS</h1>
            <p class="subtitle" id="subtitleText">Welcome Back</p>
            
            <div class="auth-tabs" style="display: flex; gap: 1rem; margin-top: -0.5rem; z-index: 10;">
                <button type="button" class="tab-btn active" onclick="switchAuthMode('login')">LOG IN</button>
                <button type="button" class="tab-btn" onclick="switchAuthMode('register')">SIGN UP</button>
            </div>
            
            <form class="login-form" id="authForm">
                <div class="input-group" id="nameGroup" style="display: none;">
                    <label for="name" class="input-label">Full Name</label>
                    <input type="text" id="name" class="tactical-input" placeholder="John Doe">
                </div>

                <div class="input-group">
                    <label for="email" class="input-label">Email Address</label>
                    <input type="email" id="email" class="tactical-input" placeholder="name@example.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <input type="password" id="password" class="tactical-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-redacta btn-submit" id="submitBtn">Log In</button>
                
                <div class="social-login-divider">
                    <span>OR</span>
                </div>
                
                <div class="social-buttons">
                    <button type="button" class="btn-social" id="googleSignInBtn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                        Continue with Google
                    </button>
                    <button type="button" class="btn-social" id="appleSignInBtn">
                        <img src="https://www.svgrepo.com/show/511330/apple-173.svg" alt="Apple" style="filter: invert(1);" width="20">
                        Continue with Apple
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>By Prakarsh Thakur 2026</p>
    </footer>

    <!-- Info Modal -->
    <div id="infoModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 6, 12, 0.85); z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
        <div class="glass-panel" style="padding: 2.5rem 3rem; max-width: 400px; text-align: center; gap: 1.5rem; animation: modalIn 0.3s ease;">
            <h2 class="logo-text" style="font-size: 1.8rem;">🎓</h2>
            <h2 class="logo-text" style="font-size: 1.6rem;">Coming Soon</h2>
            <p style="color: #93c5fd; font-size: 0.95rem; line-height: 1.6; letter-spacing: 0.03em;">University logins are on the way. Soon you'll be able to sign in directly with your college email.</p>
            <button class="btn-redacta" style="padding: 0.7rem 2.5rem; font-size: 0.95rem;" onclick="document.getElementById('infoModal').style.display='none';">Got it</button>
        </div>
    </div>
    <style>
        @keyframes modalIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>

    <script src="script.js"></script>
    <script type="module" src="firebase-auth.js"></script>
    <script>
        document.getElementById('infoBtn').addEventListener('click', () => {
            document.getElementById('infoModal').style.display = 'flex';
        });
        document.getElementById('infoModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('infoModal')) {
                document.getElementById('infoModal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
