<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="nxus-ga-measurement-id" content="G-30KZZMNYKN">
    <script src="analytics.js" defer></script>
    <meta name="description" content="NXUS - Fun. For Everyone.">
    <title>NXUS | Fun. For Everyone.</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ===== Login Page Overrides ===== */
        body.login-page {
            background: #0a0e1a;
            overflow-x: hidden;
        }

        /* Static river background */
        .river-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 80%, rgba(30, 58, 138, 0.5) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 75% 20%, rgba(234, 88, 12, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse 90% 60% at 50% 50%, rgba(15, 23, 42, 0.8) 0%, transparent 80%),
                radial-gradient(ellipse 40% 80% at 10% 30%, rgba(30, 64, 175, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse 50% 70% at 90% 70%, rgba(217, 119, 6, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse 100% 100% at 50% 100%, rgba(30, 58, 138, 0.3) 0%, transparent 60%),
                linear-gradient(160deg, #0a0e1a 0%, #0f172a 30%, #1a0f0a 60%, #0d1321 100%);
        }

        /* Flowing river veins */
        .river-bg::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 120% 15% at 30% 85%, rgba(30, 64, 175, 0.35) 0%, transparent 70%),
                radial-gradient(ellipse 100% 12% at 70% 15%, rgba(234, 88, 12, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse 80% 10% at 50% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%);
            filter: blur(30px);
        }

        .river-bg::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(5, 8, 15, 0.7) 100%);
        }

        /* ===== iOS Liquid Glass ===== */
        .liquid-glass {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow:
                0 0 0 0.5px rgba(255, 255, 255, 0.1) inset,
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 2px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        /* Refraction highlight — top edge bulge */
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: 0; left: 5%; right: 5%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.4), transparent);
            border-radius: 50%;
            filter: blur(0.5px);
        }

        /* Edge refraction glow — bottom and sides */
        .liquid-glass::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; top: 0;
            border-radius: 28px;
            background: 
                linear-gradient(to bottom, rgba(255, 255, 255, 0.08) 0%, transparent 15%),
                linear-gradient(to top, rgba(59, 130, 246, 0.06) 0%, transparent 15%),
                linear-gradient(to right, rgba(234, 88, 12, 0.04) 0%, transparent 10%),
                linear-gradient(to left, rgba(59, 130, 246, 0.04) 0%, transparent 10%);
            pointer-events: none;
            z-index: 0;
        }

        .liquid-glass > * {
            position: relative;
            z-index: 1;
        }

        /* Glass input */
        .glass-input {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Space Mono', monospace;
            font-size: 0.95rem;
            padding: 0.85rem 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.05) inset;
        }

        .glass-input:focus {
            border-color: rgba(234, 88, 12, 0.5);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.1), 0 0 0 0.5px rgba(255, 255, 255, 0.08) inset;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Glass button */
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #fff;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: 5%; right: 5%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        /* Glass social button */
        .glass-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .glass-social:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Glass icon button */
        .glass-icon-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 34px; height: 34px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .glass-icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        /* Tabs */
        .glass-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
            width: 100%;
        }

        .glass-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            padding: 0.6rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
        }

        .glass-tab.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Divider */
        .glass-divider {
            display: flex;
            align-items: center;
            width: 100%;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        .glass-divider::before,
        .glass-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-divider span {
            padding: 0 12px;
            font-family: 'Space Mono', monospace;
        }

        /* Labels */
        .glass-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: left;
            width: 100%;
            letter-spacing: 0.05em;
        }

        /* Logo on login */
        .login-hero {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(3.5rem, 10vw, 5rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #ffffff;
            line-height: 1;
            margin-right: -0.15em;
        }

        .login-tagline {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.08em;
            margin-top: -0.5rem;
        }

        /* Form wrapper */
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        /* Redacta nav pill */
        .nav-pill {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            z-index: 20;
        }

        .nav-pill button {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        .nav-pill button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* Footer override */
        .login-footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.15em;
            font-family: 'Space Mono', monospace;
        }

        /* Modal override */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(5, 8, 15, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .modal-glass {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: modalIn 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .modal-glass::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        @keyframes modalIn {
            from { transform: scale(0.92) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .nav-pill.redacta-desktop { display: none !important; }
            .redacta-mobile { display: flex !important; }

            .liquid-glass {
                max-width: 92%;
                padding: 2.5rem 1.5rem;
                border-radius: 24px;
            }

            .login-hero {
                font-size: clamp(2.8rem, 14vw, 4rem);
            }

            .login-tagline {
                font-size: 0.75rem;
            }

            .glass-input {
                font-size: 0.9rem;
            }

            .modal-glass {
                max-width: 85%;
                padding: 2rem 1.5rem;
            }
        }

        @media (max-width: 400px) {
            .liquid-glass {
                padding: 2rem 1.2rem;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body class="login-page">
    <div class="river-bg"></div>
    
    <div class="nav-pill redacta-desktop">
        <button onclick="window.location.href='https://redacta.nxus.fun'" data-tooltip="the easiest redaction tool ever">Try Redacta</button>
    </div>

    <div class="content-wrapper">
        <div class="liquid-glass" style="position: relative;">
            <button type="button" class="glass-icon-btn redacta-mobile" onclick="window.location.href='https://redacta.nxus.fun'" style="top: 1rem; left: 1rem; display: none; color: var(--accent); font-weight: bold;">R</button>
            <button type="button" class="glass-icon-btn" id="infoBtn" style="top: 1rem; right: 1rem;">i</button>

            <h1 class="login-hero">NXUS</h1>
            <p class="login-tagline">ebay for fun.</p>

            <div class="glass-tabs" id="authTabs">
                <button type="button" class="glass-tab active" onclick="switchAuthMode('login')">log in</button>
                <button type="button" class="glass-tab" onclick="switchAuthMode('register')">sign up</button>
            </div>

            <form class="auth-form" id="authForm">
                <div class="input-row" id="nameGroup" style="display: none;">
                    <label class="glass-label" for="name">your name</label>
                    <input type="text" id="name" class="glass-input" placeholder="what do people call you?">
                </div>

                <div class="input-row">
                    <label class="glass-label" for="email">email</label>
                    <input type="email" id="email" class="glass-input" placeholder="you@college.edu" required>
                </div>
                
                <div class="input-row">
                    <label class="glass-label" for="password">password</label>
                    <input type="password" id="password" class="glass-input" placeholder="something secure pls" required>
                </div>
                
                <button type="submit" class="glass-btn" id="submitBtn">let's go →</button>

                <div class="glass-divider">
                    <span>or</span>
                </div>

                <div style="display: flex; flex-direction: column; gap: 0.6rem; width: 100%;">
                    <button type="button" class="glass-social" id="googleSignInBtn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18">
                        continue with google
                    </button>
                    <button type="button" class="glass-social" id="appleSignInBtn">
                        <img src="https://www.svgrepo.com/show/511330/apple-173.svg" alt="Apple" style="filter: invert(1);" width="18">
                        continue with apple
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="login-footer">
        <p>by prakarsh thakur 2026</p>
    </footer>

    <!-- Info Modal -->
    <div id="infoModal" class="modal-overlay">
        <div class="modal-glass">
            <p style="font-size: 2rem;">🎓</p>
            <h2 style="font-family: 'Share Tech Mono', monospace; font-size: 1.4rem; color: #fff; letter-spacing: 0.1em;">coming soon</h2>
            <p style="color: rgba(255,255,255,0.5); font-size: 0.9rem; line-height: 1.6; font-family: 'Space Mono', monospace;">university logins are on the way. soon you'll sign in directly with your college email.</p>
            <button class="glass-btn" style="margin-top: 0.5rem;" onclick="document.getElementById('infoModal').style.display='none';">got it ✓</button>
        </div>
    </div>

    <script type="module" src="firebase-auth.js"></script>
    <script>
        // Auth mode toggle
        function switchAuthMode(mode) {
            const subtitle = document.querySelector('.login-tagline');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('submitBtn');
            const nameInput = document.getElementById('name');
            const tabs = document.querySelectorAll('.glass-tab');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            
            if (mode === 'login') {
                subtitle.innerHTML = 'ebay for fun.';
                nameGroup.style.display = 'none';
                nameInput.removeAttribute('required');
                submitBtn.innerText = "let's go →";
                tabs[0].classList.add('active');
            } else {
                subtitle.innerHTML = 'ebay for fun.';
                nameGroup.style.display = 'flex';
                nameInput.setAttribute('required', 'true');
                submitBtn.innerText = "create account →";
                tabs[1].classList.add('active');
            }
        }

        // Info modal
        document.getElementById('infoBtn').addEventListener('click', () => {
            document.getElementById('infoModal').style.display = 'flex';
        });
        document.getElementById('infoModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('infoModal')) {
                document.getElementById('infoModal').style.display = 'none';
            }
        });
    </script>
</body>
</html>
