    <style>
        /* ===== Login Page Overrides ===== */
        body.login-page {
            background: #000000;
            overflow-x: hidden;
            color: #ff0000;
        }

        /* Static river background */
        .river-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
            background: #000000;
        }

        .river-bg::before, .river-bg::after {
            display: none;
        }

        /* ===== Red Glass ===== */
        .liquid-glass {
            position: relative;
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            padding: 3rem 2.5rem;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            width: 100%;
            max-width: 440px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .liquid-glass::before, .liquid-glass::after {
            display: none;
        }

        .liquid-glass > * {
            position: relative;
            z-index: 1;
        }

        /* Glass input */
        .glass-input {
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 0.95rem;
            padding: 0.85rem 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        .glass-input:focus {
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 10px #ff0000;
        }

        .glass-input::placeholder {
            color: rgba(255, 0, 0, 0.5);
        }

        /* Glass button */
        .glass-btn {
            background: #ff0000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #000000;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
        }

        .glass-btn:hover {
            background: #cc0000;
            box-shadow: 0 0 20px #ff0000;
            color: #000000;
        }

        /* Glass social button */
        .glass-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
        }

        .glass-social:hover {
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 10px #ff0000;
        }

        /* Glass icon button */
        .glass-icon-btn {
            position: absolute;
            background: #000000;
            border: 1px solid #ff0000;
            width: 34px; height: 34px;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-size: 0.9rem;
            color: #ff0000;
        }

        .glass-icon-btn:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Tabs */
        .glass-tabs {
            display: flex;
            background: #000000;
            border: 1px solid #ff0000;
            padding: 0;
            gap: 0;
            width: 100%;
        }

        .glass-tab {
            flex: 1;
            background: transparent;
            border: none;
            border-right: 1px solid #ff0000;
            color: rgba(255, 0, 0, 0.5);
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            padding: 0.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            border-radius: 0;
            text-transform: uppercase;
        }

        .glass-tab:last-child {
            border-right: none;
        }

        .glass-tab.active {
            background: #ff0000;
            color: #000000;
            font-weight: bold;
        }

        /* Divider */
        .glass-divider {
            display: flex;
            align-items: center;
            width: 100%;
            color: #ff0000;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        .glass-divider::before,
        .glass-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ff0000;
        }

        .glass-divider span {
            padding: 0 12px;
            font-family: 'Oswald', sans-serif;
        }

        /* Labels */
        .glass-label {
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            color: #ff0000;
            text-align: left;
            width: 100%;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Logo on login */

            margin-bottom: 0px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.8));
        }

        .login-tagline {

            font-size: 0.85rem;

            letter-spacing: 0.08em;

            position: relative;

        }

        .input-row {

        }

            top: 1.5rem; right: 1.5rem;
            z-index: 20;
        }

        .nav-pill button {
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            color: #ff0000;
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-pill button:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* Footer override */
        .login-footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            font-size: 0.75rem;
            color: rgba(255, 0, 0, 0.6);
            letter-spacing: 0.15em;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        /* Modal override */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000000;
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-glass {
            background: #000000;
            border: 1px solid #ff0000;
            border-radius: 0;
            padding: 2.5rem;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            animation: modalIn 0.3s ease;
            position: relative;
            box-shadow: 0 0 20px #ff0000;
        }

        @keyframes modalIn {
            from { transform: scale(0.92) translateY(10px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Coming Soon Screen */
        #comingSoonScreen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;

        .coming-soon-form input {

    <script>
        // Auth mode toggle
        function switchAuthMode(mode) {
            const subtitle = document.querySelector('.login-tagline');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('submitBtn');
            const nameInput = document.getElementById('name');
            const tabs = document.querySelectorAll('.glass-tab');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            
            if (mode === 'login') {
                subtitle.innerHTML = 'ebay for fun.';
                nameGroup.style.display = 'none';
                nameInput.removeAttribute('required');
                submitBtn.innerText = "let's go →";
                tabs[0].classList.add('active');
            } else {
                subtitle.innerHTML = 'ebay for fun.';
                nameGroup.style.display = 'flex';
                nameInput.setAttribute('required', 'true');
                submitBtn.innerText = "create account →";
                tabs[1].classList.add('active');
            }
        }

        // Info modal
        document.getElementById('infoBtn').addEventListener('click', () => {
            document.getElementById('infoModal').style.display = 'flex';
        });
        document.getElementById('infoModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('infoModal')) {
                document.getElementById('infoModal').style.display = 'none';
            }
        });
    </script>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(function(err){ console.log("SW registration failed", err); });
      }

      // Coming Soon Logic
      document.getElementById('unlockForm').addEventListener('submit', function(e) {
          e.preventDefault();
          const codeInput = document.getElementById('unlockCode');
          if (codeInput.value === 'MAKEDUBAIGREATAGAIN') {
              document.getElementById('comingSoonScreen').style.display = 'none';
          } else {
              codeInput.value = '';
              codeInput.placeholder = 'ACCESS DENIED';
              setTimeout(() => {
                  codeInput.placeholder = 'Enter Access Code';
              }, 2000);
          }
      });

      // PWA Install Prompt Logic
      (function() {
          const overlay = document.getElementById('installSheetOverlay');
          const closeBtn = document.getElementById('installCloseBtn');
          const androidBtn = document.getElementById('androidInstallBtn');
          const iosInstructions = document.getElementById('iosInstallInstructions');
          
          let deferredPrompt;

          const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone || document.referrer.includes('android-app://');
          const dismissed = localStorage.getItem('installDismissed') === 'true';

          // Detect OS
          const userAgent = window.navigator.userAgent.toLowerCase();
          const isIOS = /iphone|ipad|ipod/.test(userAgent);
          const isSafari = isIOS && /safari/.test(userAgent) && !/crios|fxios/.test(userAgent);
          const isAndroid = /android/.test(userAgent);

          // Listen for Android beforeinstallprompt
          window.addEventListener('beforeinstallprompt', (e) => {
              e.preventDefault();
              deferredPrompt = e;
              
              if (!dismissed && !isStandalone && isAndroid) {
                  // Wait 5 seconds
                  setTimeout(() => {
                      androidBtn.style.display = 'block';
                      overlay.classList.add('show');
                  }, 5000);
              }
          });

          // Show for iOS Safari
          if (isIOS && isSafari && !dismissed && !isStandalone) {
              setTimeout(() => {
                  iosInstructions.style.display = 'block';
                  overlay.classList.add('show');
              }, 5000);
          }

          // Handle close
          closeBtn.addEventListener('click', () => {
              overlay.classList.remove('show');
              localStorage.setItem('installDismissed', 'true');
          });
          
          // Handle Android Install Click
          androidBtn.addEventListener('click', async () => {
              if (deferredPrompt) {
                  deferredPrompt.prompt();
                  const { outcome } = await deferredPrompt.userChoice;
                  if (outcome === 'accepted') {
                      console.log('User accepted the install prompt');
                      overlay.classList.remove('show');
                      localStorage.setItem('installDismissed', 'true');
                  }
                  deferredPrompt = null;
              }
          });
      })();
    </script>
</body>
</html>
