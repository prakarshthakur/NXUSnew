  <script>
    // Recovery: only fires once per session to prevent reload loops.
    // Triggers when a hashed JS asset 404s (stale SW served old index.html).
    function nxusRecover() {
      if (sessionStorage.getItem('nxus_recovering')) return;
      sessionStorage.setItem('nxus_recovering', '1');
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
          window.location.reload(true);
        });
      } else {
        window.location.reload(true);
      }
    }

    window.addEventListener('error', function(event) {
      // Only react to script/asset load failures, not generic JS errors
      var isAssetLoad = event.target && event.target.tagName === 'SCRIPT' && event.target.src && event.target.src.indexOf('/assets/') !== -1;
      if (isAssetLoad) { nxusRecover(); }
    }, true);
  </script>
